services:
  init:
    image: alpine:3.21
    restart: "no"
    command:
      - sh
      - -c
      - |
        [ -f /workspace/tickers.yaml ] || printf 'portfolio: {}\nwatchlist: {}\n' > /workspace/tickers.yaml
        mkdir -p /workspace/data /workspace/output
        chmod -R 777 /workspace/data /workspace/output
        chmod 666 /workspace/tickers.yaml
    volumes:
      - .:/workspace

  market-radar:
    image: ghcr.io/dazanestor/market-radar-ai:trade-republic
    container_name: market-radar-ai
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully

    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      MODEL: ${MODEL:-claude-haiku-4-5-20251001}
      REPORT_HOUR: ${REPORT_HOUR:-8}
      TIMEZONE: ${TIMEZONE:-Europe/Madrid}
      MPLCONFIGDIR: /app/output/.matplotlib
      TR_PHONE:        ${TR_PHONE:-}
      TR_PIN:          ${TR_PIN:-}
      TR_COOKIES_FILE: ${TR_COOKIES_FILE:-data/tr_cookies.txt}

    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3, os; db='/app/data/radar.db'; sqlite3.connect(db).execute('SELECT 1') if os.path.exists(db) else None"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - ./tickers.yaml:/app/tickers.yaml
      - ./templates:/app/templates

  market-radar-web:
    image: ghcr.io/dazanestor/market-radar-ai:trade-republic
    container_name: market-radar-web
    restart: unless-stopped
    command: ["uvicorn", "web:app", "--host", "0.0.0.0", "--port", "8589"]
    depends_on:
      init:
        condition: service_completed_successfully

    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      MODEL: ${MODEL:-claude-haiku-4-5-20251001}
      REPORT_HOUR: ${REPORT_HOUR:-8}
      TIMEZONE: ${TIMEZONE:-Europe/Madrid}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      MPLCONFIGDIR: /app/output/.matplotlib
      TR_PHONE:        ${TR_PHONE:-}
      TR_PIN:          ${TR_PIN:-}
      TR_COOKIES_FILE: ${TR_COOKIES_FILE:-data/tr_cookies.txt}

    ports:
      - "${WEB_PORT:-8589}:8589"

    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - ./tickers.yaml:/app/tickers.yaml
