services:
  market-radar:
    build: .
    container_name: market-radar-ai
    restart: unless-stopped

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      MODEL: gpt-4o-mini

    volumes:
      - ./output:/app/output
      - ./radar.db:/app/radar.db
      - ./tickers.yaml:/app/tickers.yaml
