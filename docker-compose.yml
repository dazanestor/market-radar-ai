services:
  market-radar:
    image: ghcr.io/dazanestor/market-radar-ai:latest
    container_name: market-radar-ai
    restart: unless-stopped

    environment:
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}
      MODEL:              ${MODEL:-claude-haiku-4-5-20251001}
      REPORT_HOUR:        ${REPORT_HOUR:-8}
      TIMEZONE:           ${TIMEZONE:-Europe/Madrid}
      MPLCONFIGDIR:       /app/output/.matplotlib
      TR_PHONE:           ${TR_PHONE:-}
      TR_PIN:             ${TR_PIN:-}
      TR_COOKIES_FILE:    ${TR_COOKIES_FILE:-data/tr_cookies.txt}

    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3, os; db='/app/data/radar.db'; sqlite3.connect(db).execute('SELECT 1') if os.path.exists(db) else None"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    volumes:
      - ./output:/app/output
      - ./data:/app/data

  market-radar-web:
    image: ghcr.io/dazanestor/market-radar-ai:latest
    container_name: market-radar-web
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "web:app", "--host", "0.0.0.0", "--port", "8589",
              "--proxy-headers", "--forwarded-allow-ips", "*"]

    environment:
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}
      MODEL:              ${MODEL:-claude-haiku-4-5-20251001}
      REPORT_HOUR:        ${REPORT_HOUR:-8}
      TIMEZONE:           ${TIMEZONE:-Europe/Madrid}
      WEB_PASSWORD:       ${WEB_PASSWORD:-}
      COOKIE_SECURE:      ${COOKIE_SECURE:-}
      MPLCONFIGDIR:       /app/output/.matplotlib
      TR_PHONE:           ${TR_PHONE:-}
      TR_PIN:             ${TR_PIN:-}
      TR_COOKIES_FILE:    ${TR_COOKIES_FILE:-data/tr_cookies.txt}

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8589/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    ports:
      - "${WEB_PORT:-8589}:8589"

    volumes:
      - ./output:/app/output
      - ./data:/app/data

  backup:
    image: alpine:3.21
    restart: unless-stopped
    # ISO 27001 A.10.2 / A.12.3: backups cifrados con AES-256-CBC.
    # Requiere BACKUP_PASSPHRASE en el .env. Para restaurar:
    #   openssl enc -d -aes-256-cbc -pbkdf2 -in radar_YYYYMMDD.db.enc -out radar.db -pass env:BACKUP_PASSPHRASE
    environment:
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    entrypoint: >
      sh -c "
        apk add --no-cache openssl 2>/dev/null;
        while true; do
          sleep 86400;
          mkdir -p /data/backups;
          DATE=$$(date +%Y%m%d);
          if [ -n \"$$BACKUP_PASSPHRASE\" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt
              -in /data/radar.db
              -out /data/backups/radar_$${DATE}.db.enc
              -pass env:BACKUP_PASSPHRASE 2>/dev/null || true;
            ls -t /data/backups/radar_*.db.enc 2>/dev/null | tail -n +8 | xargs rm -f;
            echo \"[backup] snapshot cifrado $$(date +%Y-%m-%d) completado\";
          else
            cp /data/radar.db /data/backups/radar_$${DATE}.db 2>/dev/null || true;
            ls -t /data/backups/radar_*.db 2>/dev/null | tail -n +8 | xargs rm -f;
            echo \"[backup] snapshot SIN cifrar $$(date +%Y-%m-%d) — configura BACKUP_PASSPHRASE\";
          fi
        done
      "
    volumes:
      - ./data:/data
