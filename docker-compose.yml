services:
  market-radar:
    image: ghcr.io/dazanestor/market-radar-ai:latest
    container_name: market-radar-ai
    restart: unless-stopped

    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      MODEL: claude-haiku-4-5-20251001
      REPORT_HOUR: 8
      TIMEZONE: Europe/Madrid

    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - ./tickers.yaml:/app/tickers.yaml
