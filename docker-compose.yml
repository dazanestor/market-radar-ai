services:
  init:
    image: alpine
    restart: "no"
    command:
      - sh
      - -c
      - "[ -f /workspace/tickers.yaml ] || printf 'portfolio: {}\\nwatchlist: {}\\n' > /workspace/tickers.yaml"
    volumes:
      - .:/workspace

  market-radar:
    image: ghcr.io/dazanestor/market-radar-ai:latest
    container_name: market-radar-ai
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully

    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      MODEL: ${MODEL:-claude-haiku-4-5-20251001}
      REPORT_HOUR: ${REPORT_HOUR:-8}
      TIMEZONE: ${TIMEZONE:-Europe/Madrid}

    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.isdir('/app/data') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - ./tickers.yaml:/app/tickers.yaml

  market-radar-web:
    image: ghcr.io/dazanestor/market-radar-ai:latest
    container_name: market-radar-web
    restart: unless-stopped
    command: ["uvicorn", "web:app", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      init:
        condition: service_completed_successfully

    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      MODEL: ${MODEL:-claude-haiku-4-5-20251001}
      REPORT_HOUR: ${REPORT_HOUR:-8}
      TIMEZONE: ${TIMEZONE:-Europe/Madrid}
      WEB_PASSWORD: ${WEB_PASSWORD:-}

    ports:
      - "${WEB_PORT:-8080}:8080"

    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - ./tickers.yaml:/app/tickers.yaml
